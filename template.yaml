        APP_SLS_STAGE: !Ref Stage
        TZ: "GMT"
        APP_SLS_REGION: ap-south-1

        # AWS Account / Network
        APP_AWS_ACCOUNT_ID: !Ref AppAwsAccountId
        APP_AWS_VPC: !Ref AppAwsVpc
        APP_AWS_SECURITY_GROUP: !Ref AppAwsSecurityGroup
        APP_AWS_SUBNET1: !Ref AppAwsSubnet1
        APP_AWS_SUBNET2: !Ref AppAwsSubnet2
        APP_AWS_REGION: !Ref AppSlsRegion

        # S3 Buckets
        APP_AWS_S3_BUCKET_WORKO_CORPORATE: !Ref AppAwsS3BucketWorkoCorporate
        APP_AWS_S3_BUCKET_WORKO_APP: !Ref AppAwsS3BucketWorkoApp
        APP_AWS_S3_BUCKET_WORKO_UI_COMP_LOGO: !Ref AppAwsS3BucketWorkoUiCompLogo

        # AWS SQS Configurations
        APP_AWS_SQS_QUEUE_NAME: "worko-app-event-queue"

        APP_AWS_DYNAMODB_TABLE_NAME: "worko"

        # Bill Desk Payment Gateway Credentials
        APP_BILLDESK_MERCHANT_ID: "BDUAT2K236"
        APP_BILLDESK_CLIENT_ID: "bduat2k236"
        APP_BILLDESK_SECRET_KEY: "REDACTED"
        APP_BILLDESK_API_BASE_URL: "https://uat1.billdesk.com/u2/payments/ve1_2"

        # RazorPay Payment Gateway Credentials
        APP_RAZORPAY_KEY_ID: "rzp_test_yq5Mt1KeflWopy"
        APP_RAZORPAY_KEY_SECRET: "REDACTED"

        # WhatsApp Cloud Api and Webhook Credentials
        APP_WHATSAPP_CLOUD_API_BASE_URL: "https://graph.facebook.com"
        APP_WHATSAPP_CLOUD_API_BUSINESS_ACCOUNT_ID:  "497617343443104" # Previously "461597530360541"
        APP_WHATSAPP_CLOUD_API_FROM_PHONE_NUMBER_ID: "496822040188825"
        APP_WHATSAPP_CLOUD_API_FROM_PHONE_NUMBER: "919811929282"
        APP_WHATSAPP_CLOUD_API_ACCESS_TOKEN: "REDACTED"
        APP_WHATSAPP_WEBHOOK_VERIFY_TOKEN: "workoAuth" #@todo : Change the verify token 

        # Growaasan Cloud Api 
        APP_GROWAASAN_CLOUD_API_BASE_URL: "https://api.growaasan.com/api" # End point Url of Send Template Message API 
        APP_GROWAASAN_CLOUD_API_CLIENT_ID: "102270" # Unique Id provided by Gro-waasan team for the client (Mandatory)
        APP_GROWAASAN_CLOUD_API_AUTHENTICATION_KEY: "REDACTED" # Authentication Key provided by growaasan team (Mandatory)
        APP_GROWAASAN_CLOUD_API_FROM_PHONE_NUMBER_COUNTRY_CODE: "91"
        APP_GROWAASAN_CLOUD_API_FROM_PHONE_NUMBER: "9811929282"
        APP_LOGGER_LOG_FORMAT: "json"

        # Worko Base URL
        APP_WORKO_FRONTEND_BASE_URL: !Ref AppWorkoFrontendBaseUrl

        # LOGOS
        APP_WORKO_LOGO_URL: "https://worko.ai/assets/logo-text-Dfe5k43I.webp"

        # AWS COGNITO
        APP_AWS_COGNITO_USER_POOL_ID: !Ref AppAwsCognitoUserPoolId

        # WhatsAppBusinessPartner Cloud Api 
        APP_WHATSAPP_BUSINESS_PARTNER_CLOUD_API_BASE_URL: "https://partnersv1.pinbot.ai/v3" # End point Url of Send Template Message API 
        APP_WHATSAPP_BUSINESS_PARTNER_CLOUD_API_KEY: "REDACTED" # Api Key provided by WHATSAPP BUSINESS PARTNER team 
        APP_WHATSAPP_BUSINESS_PARTNER_CLOUD_API_FROM_PHONE_NUMBER_ID: "496822040188825" # Phone number id for `+91 9811929282` 
        APP_WHATSAPP_BUSINESS_PARTNER_CLOUD_API_FROM_PHONE_NUMBER: "919811929282" 

        # Worko Social Profile Details
        APP_WORKO_SOCIAL_PROFILE_INSTAGRAM_URL: "https://instagram.com/worko_ai"
        APP_WORKO_SOCIAL_PROFILE_INSTAGRAM_LOGO_URL: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Instagram_icon.png/2048px-Instagram_icon.png"
        APP_WORKO_SOCIAL_PROFILE_LINKEDIN_URL: "https://www.linkedin.com/company/worko"
        APP_WORKO_SOCIAL_PROFILE_LINKEDIN_LOGO_URL: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/ca/LinkedIn_logo_initials.png/600px-LinkedIn_logo_initials.png"

        # AWS LAMBDA NAMES
        APP_AWS_RESUME_SIGNUP_SKILLS_PARSER_LAMBDA_NAME: !Ref AppAwsResumeSignupSkillsParserLambdaName

        # Referral Feature Related Environments
        APP_WORKO_REFERRAL_DONE_STATUS_REMAINDER_LIMIT: !Ref AppWorkoReferralDoneStatusRemainderLimit

        # Aws Secrets manager
        APP_AWS_SECRETS_MANAGER_GCP_AI_PLATFORM: !Sub "GCP-aiplatform-secrect-${Stage}"
        APP_AWS_SECRETS_MANAGER_GCP_AI_PLATFORM_ARN_SECRET: !Ref AppAwsSecretsManagerGcpAiPlatformArnSecret
        APP_AWS_SECRETS_MANAGER_GCP_FIRESTORE: !Sub "GCP-firestore-secret-${Stage}"
        APP_AWS_SECRETS_MANAGER_GCP_FIRESTORE_ARN_SECRET: !Ref AppAwsSecretsManagerGcpFirestoreArnSecret

        # GCP Ai Platform Configuration
        APP_GCP_AI_PLATFORM_EMBEDDING_MODEL_NAME: "text-embedding-004"
        APP_GCP_AI_PLATFORM_EMBEDDING_LOCATION: "asia-south1"

        # GCP Project details
        APP_GCP_PROJECT_ID: !Sub "worko-${Stage}"

        APP_WORKO_REFERRAL_SOURCE_TYPE_ACTIVATION_EMAIL_DOMAIN: !Ref AppWorkoReferralSourceTypeActivationEmailDomain

        APP_AWS_SCHEDULER_HANDLER_LAMBDA_ARN: !Sub "arn:aws:lambda:${AppSlsRegion}:${AppAwsAccountId}:function:worko-api-${Stage}-app-scheduler-handler"
        APP_AWS_SCHEDULER_HANDLER_ROLE_ARN: !Sub "arn:aws:iam::${AppAwsAccountId}:role/worko-schedule-invoke-lambda-role"

        APP_AWS_INTERVIEW_SERVICE_LAMBDA_NAME: "worko-video-interview-workflow"

        # Local authorizer mock user (used when APP_STAGE=local)
        APP_AWS_AUTH_MOCK_USER_ID: "REDACTED"
        APP_AWS_AUTH_MOCK_USER_EMAIL: "rohithappala777+candidate3@gmail.com"

Resources:

# =========================================================
# IAM ROLE 
# =========================================================
  WorkoApiLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "worko-api-${Stage}-lambdaRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:

        # DynamoDB
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DescribeTable
                  - dynamodb:Query
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                Resource:
                  - arn:aws:dynamodb:ap-south-1:*:table/worko
                  - arn:aws:dynamodb:ap-south-1:*:table/worko/index/GSI1
                  - arn:aws:dynamodb:ap-south-1:*:table/worko/index/GSI2
                  - arn:aws:dynamodb:ap-south-1:*:table/worko-count
                  - arn:aws:dynamodb:ap-south-1:*:table/worko-count/index/GSI1

        # SES
        - PolicyName: SESAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendBulkEmail
                  - ses:SendTemplatedEmail
                  - ses:GetTemplate
                  - ses:CreateTemplate
                  - ses:UpdateTemplate
                  - ses:DeleteTemplate
                Resource: "*"

        # S3
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - arn:aws:s3:::worko-app-*
                  - arn:aws:s3:::*/*

        # Lambda Invoke
        - PolicyName: LambdaInvokeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                  - lambda:InvokeAsync
                Resource:
                  - !Sub arn:aws:lambda:ap-south-1:${AppAwsAccountId}:function:worko-jd-resume-matching-${Stage}
                  - !Sub arn:aws:lambda:ap-south-1:${AppAwsAccountId}:function:worko-resume-parser-${Stage}
                  - !Sub arn:aws:lambda:ap-south-1:${AppAwsAccountId}:function:worko-job-description-parser-${Stage}
                  - !Sub arn:aws:lambda:ap-south-1:${AppAwsAccountId}:function:${AppAwsResumeSignupSkillsParserLambdaName}
                  - !Sub arn:aws:lambda:ap-south-1:${AppAwsAccountId}:function:worko-video-interview-workflow

        # Scheduler
        - PolicyName: SchedulerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iam:PassRole
                  - scheduler:GetSchedule
                  - scheduler:UpdateSchedule
                  - scheduler:CreateSchedule
                  - scheduler:DeleteSchedule
                Resource:
                  - !Sub arn:aws:iam::${AppAwsAccountId}:role/worko-schedule-invoke-lambda-role
                  - !Sub arn:aws:scheduler:ap-south-1:${AppAwsAccountId}:schedule/*/*

        # Cognito
        - PolicyName: CognitoAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminAddUserToGroup
                  - cognito-idp:AdminUpdateUserAttributes
                  - cognito-idp:AdminConfirmSignUp
                  - cognito-idp:AdminGetUser
                  - cognito-idp:AdminListGroupsForUser
                Resource:
                  - !Sub arn:aws:cognito-idp:ap-south-1:${AppAwsAccountId}:userpool/${AppAwsCognitoUserPoolId}

        # SNS
        - PolicyName: SNSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: "*"

        # Secrets Manager
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub arn:aws:secretsmanager:ap-south-1:${AppAwsAccountId}:secret:${AppAwsSecretsManagerGcpFirestoreArnSecret}
                  - !Sub arn:aws:secretsmanager:ap-south-1:${AppAwsAccountId}:secret:${AppAwsSecretsManagerGcpAiPlatformArnSecret}

        # SQS Access
        - PolicyName: SQSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                Resource:
                  - !Sub arn:aws:sqs:ap-south-1:${AppAwsAccountId}:worko-app-event-queue

# =========================================================
# API Gateway
# =========================================================

  WorkoApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${Stage}-worko-api"
      StageName: !Ref Stage
      Cors:
        AllowMethods: "'*'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent,X-Amzn-Trace-Id'"
        AllowOrigin: "'*'"
        AllowCredentials: false
      Auth:
        DefaultAuthorizer: WorkoAuthAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false # Do NOT apply authorizer to OPTIONS.
        Authorizers:
          WorkoAuthAuthorizer:
            FunctionPayloadType: REQUEST
            FunctionArn: !Sub arn:aws:lambda:ap-south-1:${AppAwsAccountId}:function:worko-auth
            Identity:
              Headers:
                - Authorization
              ReauthorizeEvery: 0

# =========================================================
# Functions
# =========================================================

  AppFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "worko-api-${Stage}-app"
      Timeout: 900
      CodeUri: ./
      Handler: src/app.handler
      Role: !GetAtt WorkoApiLambdaRole.Arn
      Events:
        # Explicit Preflight Root Route (NO Authorizer)
        PreflightRoot:
          Type: Api
          Properties:
            Path: /
            Method: OPTIONS
            RestApiId: !Ref WorkoApi
            Auth:
              Authorizer: NONE
        ApiGateway:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
            RestApiId: !Ref WorkoApi
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "node24"
        Sourcemap: false
        EntryPoints: 
          - src/app.ts
        External:
          - "@aws-sdk/*"

  AppEventTriggerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "worko-api-${Stage}-appeventtrigger"
      Timeout: 900
      CodeUri: ./
      Handler: src/app-event-trigger.handler
      Role: !GetAtt WorkoApiLambdaRole.Arn
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !Sub arn:aws:sqs:ap-south-1:${AppAwsAccountId}:worko-app-event-queue
            BatchSize: 1
            MaximumBatchingWindowInSeconds: 0
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "node24"
        Sourcemap: false
        EntryPoints: 
          - src/app-event-trigger.ts
        External:
          - "@aws-sdk/*"

  AppSchedulerHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "worko-api-${Stage}-app-scheduler-handler"
      Timeout: 900
      CodeUri: ./
      Handler: src/app-scheduler.handler
      Role: !GetAtt WorkoApiLambdaRole.Arn
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "node24"
        Sourcemap: false
        EntryPoints: 
          - src/app-scheduler.ts
        External:
          - "@aws-sdk/*"

Outputs:
  ApiUrl:
    Value: !Sub https://${WorkoApi}.execute-api.ap-south-1.amazonaws.com/${Stage}/

  AppFunctionArn:
    Value: !GetAtt AppFunction.Arn
  
  AppEventTriggerFunctionArn:
    Value: !GetAtt AppEventTriggerFunction.Arn

  AppSchedulerHandlerFunctionArn:
    Value: !GetAtt AppSchedulerHandlerFunction.Arn