AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Worko API Application 

Parameters:
  Stage:
    Type: String
  AppAwsAccountId:
    Type: String
  AppAwsVpc:
    Type: String
  AppAwsSecurityGroup:
    Type: String
  AppAwsSubnet1:
    Type: String
  AppAwsSubnet2:
    Type: String
  AppSlsRegion:
    Type: String
  AppAwsCognitoUserPoolId:
    Type: String
  AppAwsSecretsManagerGcpFirestoreArnSecret:
    Type: String
  AppAwsSecretsManagerGcpAiPlatformArnSecret:
    Type: String
  AppAwsS3BucketWorkoCorporate:
    Type: String
  AppAwsS3BucketWorkoApp:
    Type: String
  AppAwsS3BucketWorkoUiCompLogo:
    Type: String
  AppWorkoFrontendBaseUrl:
    Type: String
  AppAwsResumeSignupSkillsParserLambdaName:
    Type: String
  AppWorkoReferralDoneStatusRemainderLimit:
    Type: String
  AppWorkoReferralSourceTypeActivationEmailDomain:
    Type: String

Globals:
